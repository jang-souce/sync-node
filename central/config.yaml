server:
  port: ":8080"

etcd:
  endpoints:
    - "localhost:2379"
  username: ""
  password: ""

# 数据库配置
# 可通过环境变量覆盖:
# POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DBNAME
postgres:
  host: "localhost"
  port: 5432
  user: "user"
  password: "password"
  dbname: "sync_node_db"
  sslmode: "disable"

oss:
  provider: "aliyun" # aliyun or minio
  endpoint: "oss-cn-beijing.aliyuncs.com"
  accessKeyId: "key"
  accessKeySecret: "secret"
  bucketName: "yang-sync"

sms:
  accessKeyId: "key" # 假设与OSS使用相同的AK，实际应根据IAM分配
  accessKeySecret: "secret"
  signName: "SyncNode" # 替换为实际签名
  templateCode: "SMS_123456789" # 替换为实际模板ID
  phoneNumbers: 
    - "13800000000"

log:
  level: "info"
  path: "./central.log"
