version: '3'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    restart: always
    command: /usr/local/bin/etcd --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
      - "8090:8080"
    networks:
      - sync-net

  etcdkeeper:
    image: evildecay/etcdkeeper
    restart: always
    network_mode: "service:etcd"
    depends_on:
      - etcd

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sync_node_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sync-net

  central:
    build:
      context: .
      dockerfile: central/Dockerfile
    restart: always
    ports:
      - "8088:8088"
    depends_on:
      - etcd
      - postgres
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DBNAME=sync_node_db
      - POSTGRES_SSLMODE=disable
      - OSS_PROVIDER=aliyun
      - OSS_ENDPOINT=https://oss-cn-beijing.aliyuncs.com
      - OSS_ACCESSKEYID=your-access-key-id
      - OSS_ACCESSKEYSECRET=your-access-key-secret
      - OSS_BUCKETNAME=yang-sync
    networks:
      - sync-net

  node-1:
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: always
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-1
    networks:
      - sync-net

  node-2:
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: always
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-2
    networks:
      - sync-net

  node-3:
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: always
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-3
    networks:
      - sync-net

networks:
  sync-net:
    driver: bridge

volumes:
  pg_data:
