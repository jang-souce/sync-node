version: '3'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    restart: always
    command: /usr/local/bin/etcd --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
      - "8090:8080"
    networks:
      - sync-net

  etcdkeeper:
    image: evildecay/etcdkeeper
    restart: always
    network_mode: "service:etcd"
    depends_on:
      - etcd

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sync_node_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sync-net

  central:
    image: sync-node-central:latest
    build:
      context: .
      dockerfile: central/Dockerfile
    restart: always
    ports:
      - "8088:8088"
    depends_on:
      - etcd
      - postgres
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DBNAME=sync_node_db
      - POSTGRES_SSLMODE=disable
      - OSS_PROVIDER=aliyun
      - OSS_ENDPOINT=https://oss-cn-beijing.aliyuncs.com
      - OSS_ACCESSKEYID=your-access-key-id
      - OSS_ACCESSKEYSECRET=your-access-key-secret
      - OSS_BUCKETNAME=yang-sync
    volumes:
      - ./logs/central:/root/logs
    networks:
      - sync-net

  node-1:
    image: sync-node-edge:latest
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: always
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-1
      - NODE_WORKDIR=/root/downloads
    volumes:
      - ./downloads/node-1:/root/downloads
      - ./logs/node-1:/root/logs
    networks:
      - sync-net

  node-2:
    image: sync-node-edge:latest
    restart: always
    depends_on:
      - node-1
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-2
      - NODE_WORKDIR=/root/downloads
    volumes:
      - ./downloads/node-2:/root/downloads
      - ./logs/node-2:/root/logs
    networks:
      - sync-net

  node-3:
    image: sync-node-edge:latest
    restart: always
    depends_on:
      - node-1
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-3
      - NODE_WORKDIR=/root/downloads
    volumes:
      - ./downloads/node-3:/root/downloads
      - ./logs/node-3:/root/logs
    networks:
      - sync-net

  node-4:
    image: sync-node-edge:latest
    restart: always
    depends_on:
      - node-1
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-4
      - NODE_WORKDIR=/root/downloads
    volumes:
      - ./downloads/node-4:/root/downloads
      - ./logs/node-4:/root/logs
    networks:
      - sync-net

  node-5:
    image: sync-node-edge:latest
    restart: always
    depends_on:
      - node-1
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-5
      - NODE_WORKDIR=/root/downloads
    volumes:
      - ./downloads/node-5:/root/downloads
      - ./logs/node-5:/root/logs
    networks:
      - sync-net

  node-6:
    image: sync-node-edge:latest
    restart: always
    depends_on:
      - node-1
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - NODE_ID=node-6
      - NODE_WORKDIR=/root/downloads
    volumes:
      - ./downloads/node-6:/root/downloads
      - ./logs/node-6:/root/logs
    networks:
      - sync-net

networks:
  sync-net:
    driver: bridge

volumes:
  pg_data:
