version: '3'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    command: /usr/local/bin/etcd --advertise-client-urls http://0.0.0.0:2379 --listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - sync-net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sync_node_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sync-net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - sync-net
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - sync-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/sync-bucket;
      /usr/bin/mc anonymous set public myminio/sync-bucket;
      exit 0;
      "

  central:
    build:
      context: .
      dockerfile: central/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - etcd
      - postgres
      - minio
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DBNAME=sync_node_db
      - POSTGRES_SSLMODE=disable
      - OSS_ENDPOINT=oss-cn-beijing.aliyuncs.com
      - OSS_ACCESSKEYID=YOUR_ACCESS_KEY_ID
      - OSS_ACCESSKEYSECRET=YOUR_ACCESS_KEY_SECRET
      - OSS_BUCKETNAME=yang-sync
    networks:
      - sync-net

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - central
      - etcd
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
    networks:
      - sync-net

networks:
  sync-net:
    driver: bridge

volumes:
  pg_data:
  minio_data:
